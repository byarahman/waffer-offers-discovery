
<!doctype html>
<html lang="en">
  <head>
    <!-- Basic configuration -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta name="theme-color" content="#123d34" />
    <meta name="color-scheme" content="light" />

    <!-- SEO -->
    <title>Waffer Offers — Discover More, Spend Wisely</title>

    <meta
      name="description"
      content="Discover exclusive Waffer card offers across the UAE. Browse businesses, explore discounts, compare deals, and find savings on shopping, dining, healthcare, hotels, education, and more."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://byarahman.github.io/waffer-offers-discovery/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="%BASE_URL%assets/favicon.svg"
      type="image/svg+xml"
    />

    <!-- Open Graph: WhatsApp, Facebook, LinkedIn -->
    <meta property="og:type" content="website" />

    <meta
      property="og:site_name"
      content="Waffer Offers Discovery"
    />

    <meta
      property="og:title"
      content="Waffer Offers — Discover More, Spend Wisely"
    />

    <meta
      property="og:description"
      content="Your guide to exclusive Waffer card offers across the UAE. Discover discounts, compare benefits, and explore savings from 100+ businesses."
    />

    <meta
      property="og:url"
      content="https://byarahman.github.io/waffer-offers-discovery/"
    />

    <meta
      property="og:image"
      content="https://byarahman.github.io/waffer-offers-discovery/waffer-preview.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://byarahman.github.io/waffer-offers-discovery/waffer-preview.png"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="Waffer Offers Discovery — Explore exclusive discounts and savings across the UAE."
    />

    <meta
      property="og:locale"
      content="en_AE"
    />

    <!-- X / Twitter sharing -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Waffer Offers — Discover More, Spend Wisely"
    />

    <meta
      name="twitter:description"
      content="Explore exclusive Waffer discounts across the UAE. Find offers, compare deals, and discover more ways to save."
    />

    <meta
      name="twitter:image"
      content="https://byarahman.github.io/waffer-offers-discovery/waffer-preview.png"
    />

    <meta
      name="twitter:image:alt"
      content="Waffer Offers Discovery — Your guide to exclusive UAE discounts."
    />

    <!-- Application -->
  </head>

  <body>
    <div id="root">
      <div class="loading-screen">
        <span class="loader-mark">w.</span>
        <p>Preparing your offers…</p>
      </div>
    </div>

    <noscript>
      <div class="no-script">
        JavaScript is needed to explore the searchable
        Waffer offers directory.
      </div>
    </noscript>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
